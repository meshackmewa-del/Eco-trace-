<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EcoTrace — Methane Tracker & Micro-Grants</title>

  <!-- Search Engine & Mobile App Metadata -->
  <meta name="description" content="EcoTrace is an open-data community methane tracker routing cleanup micro-grants directly to local waste teams.">
  <meta name="author" content="EcoTrace Global Network">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#059669">

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet Map library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 420px; width: 100%; border-radius: 0.75rem; }
    .nav-btn.active { background-color: #059669; color: #ffffff; }
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: text; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <!-- Header Navigation Bar -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="bg-emerald-600 p-2 rounded-lg text-white">
          <i data-lucide="map-pin"></i>
        </div>
        <span class="text-xl font-bold tracking-tight text-white">EcoTrace</span>
      </div>
      <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-medium flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Network Active
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">

    <!-- Tab Bar -->
    <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 mb-6 max-w-md mx-auto">
      <button onclick="switchTab('report')" id="tab-report" class="nav-btn active flex-1 py-2 text-sm font-semibold rounded-lg transition-all flex justify-center items-center gap-2">
        <i data-lucide="camera" class="w-4 h-4"></i> Report Site
      </button>
      <button onclick="switchTab('mapTab')" id="tab-mapTab" class="nav-btn flex-1 py-2 text-sm font-semibold rounded-lg transition-all flex justify-center items-center gap-2 text-slate-400">
        <i data-lucide="map" class="w-4 h-4"></i> Live Map
      </button>
      <button onclick="switchTab('grants')" id="tab-grants" class="nav-btn flex-1 py-2 text-sm font-semibold rounded-lg transition-all flex justify-center items-center gap-2 text-slate-400">
        <i data-lucide="coins" class="w-4 h-4"></i> Micro-Grants
      </button>
    </div>

    <!-- TAB 1: REPORT DUMP SITE -->
    <section id="view-report" class="space-y-6">
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 max-w-xl mx-auto shadow-xl">
        <h2 class="text-xl font-bold mb-1 text-white">Submit Methane Point Report</h2>
        <p class="text-slate-400 text-sm mb-6">Capture unmanaged waste hotspots to route micro-grants directly to local cleanup teams.</p>

        <form id="dumpForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Dump Site Photo</label>
            <div onclick="document.getElementById('photoInput').click()" class="border-2 border-dashed border-slate-600 hover:border-emerald-500 bg-slate-900/50 p-6 rounded-xl text-center cursor-pointer transition">
              <i data-lucide="upload-cloud" class="w-8 h-8 text-emerald-400 mx-auto mb-2"></i>
              <p class="text-sm text-slate-300 font-medium">Click to select or upload photo</p>
              <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="previewImage(event)" />
            </div>
            <img id="imgPreview" class="hidden mt-3 rounded-lg w-full h-48 object-cover border border-slate-700" />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Location Coordinates</label>
            <div class="flex gap-2">
              <input type="text" id="geoInput" placeholder="-1.0388, 37.0833" required class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500" />
              <button type="button" onclick="getGPS()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1">
                <i data-lucide="crosshair" class="w-4 h-4"></i> Get Location
              </button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Estimated Waste Volume</label>
            <select id="volumeInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="Small">Small Dumping (&lt; 1 Ton)</option>
              <option value="Medium">Medium Overflow (1–5 Tons)</option>
              <option value="Large">Large Informal Dump (&gt; 5 Tons)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Site Notes</label>
            <textarea id="descInput" rows="3" placeholder="Describe waste types (e.g., organic food waste, market residue)..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500" required></textarea>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i> Submit Site Report
          </button>
        </form>
      </div>
    </section>

    <!-- TAB 2: LIVE MAP -->
    <section id="view-mapTab" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <div id="map"></div>
      </div>
    </section>

    <!-- TAB 3: MICRO-GRANTS -->
    <section id="view-grants" class="hidden space-y-6">
      <div id="grantList" class="grid md:grid-cols-2 gap-4"></div>
    </section>

  </main>

  <footer class="mt-12 py-6 text-center border-t border-slate-800 text-slate-400 text-xs">
    <p>© EcoTrace — Environmental Methane Hotspot Tracker.</p>
  </footer>

  <script>
    // REPLACE WITH YOUR GOOGLE APPS SCRIPT DEPLOYMENT URL
    const API_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID_HERE/exec";

    let dumpSites = [];
    let map, mapInitialized = false;

    lucide.createIcons();

    window.addEventListener('load', fetchSites);

    function fetchSites() {
      fetch(`${API_URL}?action=getSites`)
        .then(res => res.json())
        .then(data => {
          dumpSites = data;
        })
        .catch(err => console.error("Error loading data:", err));
    }

    function switchTab(tabName) {
      ['report', 'mapTab', 'grants'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('active');
      });
      document.getElementById(`view-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-${tabName}`).classList.add('active');

      if (tabName === 'mapTab') setTimeout(initMap, 100);
      if (tabName === 'grants') renderGrants();
    }

    function getGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          document.getElementById('geoInput').value = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
        });
      }
    }

    function previewImage(event) {
      const reader = new FileReader();
      reader.onload = function() {
        const preview = document.getElementById('imgPreview');
        preview.src = reader.result;
        preview.classList.remove('hidden');
      }
      if (event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      const coords = document.getElementById('geoInput').value.split(',');
      const payload = {
        lat: coords[0] ? coords[0].trim() : '-1.0388',
        lng: coords[1] ? coords[1].trim() : '37.0833',
        volume: document.getElementById('volumeInput').value,
        desc: document.getElementById('descInput').value
      };

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Site Report';
        alert('Report submitted successfully!');
        document.getElementById('dumpForm').reset();
        document.getElementById('imgPreview').classList.add('hidden');
        fetchSites();
        switchTab('mapTab');
      }).catch(err => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Site Report';
        alert('Error submitting report.');
      });
    }

    function initMap() {
      if (!mapInitialized) {
        map = L.map('map').setView([-1.0388, 37.0833], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        mapInitialized = true;
      }

      dumpSites.forEach(site => {
        L.marker([site.lat, site.lng]).addTo(map)
          .bindPopup(`<b>Volume:</b> ${site.volume}<br><b>Risk:</b> ${site.risk}<br>${site.desc}`);
      });
    }

    function renderGrants() {
      const container = document.getElementById('grantList');
      container.innerHTML = '';
      if (dumpSites.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm">No active grants found.</p>`;
        return;
      }
      dumpSites.forEach(site => {
        container.innerHTML += `
          <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
            <div class="flex justify-between items-center mb-2">
              <span class="text-sm font-bold text-white">Site #${site.id.toString().slice(-4)}</span>
              <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded font-semibold">$${site.grantAmount} Grant</span>
            </div>
            <p class="text-xs text-slate-300 mb-4">${site.desc}</p>
            <button onclick="applyGrant(${site.id})" ${site.status === 'Grant Assigned' ? 'disabled' : ''} class="w-full py-2.5 ${site.status === 'Grant Assigned' ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white'} rounded-lg text-sm font-semibold transition">
              ${site.status === 'Grant Assigned' ? 'Grant Disbursed' : 'Apply for Grant'}
            </button>
          </div>
        `;
      });
    }

    function applyGrant(id) {
      fetch(`${API_URL}?action=claimGrant&siteId=${id}`)
        .then(res => res.json())
        .then(res => {
          alert('Grant awarded to cleanup team!');
          fetchSites();
          renderGrants();
        });
    }
  </script>
</body>
</html>
